# =============================================================================
# Cerca — full dev environment, recreated from zero with `docker compose up`.
#
#   docker compose up -d db redis minio      # backing services
#   pnpm --filter @cerca/api prisma migrate deploy
#   pnpm --filter @cerca/api prisma db seed
#   docker compose up api                     # the API (or `pnpm dev` on the host)
#
# The `api` service builds the multi-stage image; for a fast reload loop run the
# app on the host with `pnpm dev` and use only db/redis/minio from here.
# =============================================================================
services:
  db:
    image: postgis/postgis:16-3.4 # PostgreSQL 16 + PostGIS 3.4 (geo search)
    restart: unless-stopped
    environment:
      POSTGRES_USER: cerca
      POSTGRES_PASSWORD: cerca
      POSTGRES_DB: cerca
    ports: ['5432:5432']
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cerca -d cerca']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['6379:6379']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cerca
      MINIO_ROOT_PASSWORD: cerca123
    ports: ['9000:9000', '9001:9001']
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: postgresql://cerca:cerca@db:5432/cerca?schema=public
      DIRECT_DATABASE_URL: postgresql://cerca:cerca@db:5432/cerca?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-only-secret-change-me-please-32chars-minimum-000
      CORS_ORIGINS: http://localhost:3000,http://localhost:8081
      PUBLIC_API_URL: http://localhost:3333
    ports: ['3333:3333']
    profiles: ['app'] # `docker compose --profile app up` to include the built API

volumes:
  postgres_data:
  redis_data:
  minio_data:
